[package]
name = "tauri-app"
version = "0.4.1"
description = "A Tauri App"
authors = ["Magnus Redkin"]
license = "MPL-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"


once_cell = "1"
dotenv = "0.15"

# status-go as a library inside this process (src/inprocess.rs).
#
# Every platform loads `libstatus` and calls its C exports; there is no child
# process and no local port. `libloading` was Android-only while desktop used a
# sidecar.
libloading = "0.7"

# Локальный RPC-форвардер (src/rpc_proxy.rs).
# reqwest с rustls: в дереве уже есть ring/rustls, поэтому сборка идёт офлайн
# без openssl. Фича http2 не нужна — прокси работает по HTTP/1.1.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "ansi", "time"] }
tracing-appender = "0.2.5"
tauri-plugin-updater = "2"

# Разбор ссылок-приглашений Status (src/invite.rs).
#
# Ссылка на канал несёт brotli-сжатый protobuf, а в webview brotli не
# декодируется: DecompressionStream в Chromium знает только gzip и deflate.
# Версия 9 уже есть в кэше зависимостей (приходит транзитивно), поэтому
# сборка не требует сети.
base64 = "0.22"
brotli-decompressor = "6.0"

# PIN профиля на телефоне (src/credentials.rs).
#
# PIN не хранится: из него Argon2id выводит ключ, которым зашифрован пароль профиля.
# Версии уже в кэше зависимостей, поэтому сборка идёт офлайн.
argon2 = "0.5"
aes-gcm = "0.10"
getrandom = "0.2"
zeroize = "1"

# Отпечаток строки подключения (src/pairing.rs): обе стороны показывают одни и те же
# шесть цифр от ключа, который лежит в строке. bs58 уже в дереве через транзитивные
# зависимости, sha2 — тоже, поэтому сборка идёт офлайн.
bs58 = "0.5"
sha2 = "0.10"

# Рукопожатие в локальной сети (src/lanpair.rs).
#
# X25519 для одноразовых ключей, HKDF-SHA256 для вывода ключей сеанса и шести цифр.
# AES-256-GCM уже подключён для конверта PIN. Версии лежат в кэше зависимостей,
# поэтому сборка идёт офлайн.
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"

# Внешние источники (src/providers.rs): разбор RSS/Atom и страниц Telegram.
# Версии уже лежат в кэше зависимостей, поэтому сборка идёт офлайн.
quick-xml = "0.42"
regex = "1"
url = "2"

# Открытие внешних ссылок системным обработчиком (src/opener.rs).
#
# Через плагин `shell` это требует разрешения `shell:allow-open` в
# capabilities, то есть права открывать произвольные адреса из webview. Здесь
# адрес проверяется в Rust, а системе передаётся уже проверенный.
open = "5"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Android: libstatus.so is installed into jniLibs and loaded by name.
[target.'cfg(target_os = "android")'.dependencies]
# Логи Rust уходят в logcat (тег stauri), а не в файл.
android_logger = "0.14"
log = "0.4"
